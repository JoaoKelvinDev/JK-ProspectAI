[project]
name = "jk-prospect-ai-backend"
version = "0.1.0"
description = "Backend do JK Prospect AI: Discovery e inspeção de sites candidatos."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpcore[asyncio]>=1.0,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
